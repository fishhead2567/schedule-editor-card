name: HACS Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches HACS itself changing its rules

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
