blueprint:
  name: Sync entities to schedule (restart-safe)
  description: >-
    Keeps one or more switch/light entities (including groups) matched to a
    schedule helper's on/off state. Re-checks on every Home Assistant
    startup - so if HA is offline through a scheduled on->off (or off->on)
    boundary, the targets still end up in the correct state as soon as HA
    comes back, instead of staying stuck wherever they were left. An
    optional condition can additionally gate the ON state: if any of those
    entities are 'on', the target is forced off even during an otherwise-
    active schedule block, and re-evaluated the moment the condition
    itself changes - not just at the next transition/heartbeat/restart.

    Optionally also rechecks on a fixed interval (not just at schedule
    transitions/startup) to correct drift from a manual override or
    another automation - off by default, since for many entities (lights)
    letting a manual override stick until the next real transition is the
    desired behavior, not a bug. Turn it on per-schedule only where
    silent drift is a real concern (e.g. a valve left open).
  domain: automation
  input:
    schedule_entity:
      name: Schedule
      selector:
        entity:
          domain: schedule
    target_entities:
      name: Target entities (switch or light - group helpers work too)
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true
    skip_on_entities:
      name: Force off while any of these are 'on' (optional)
      description: >-
        Overrides the schedule while any of these are 'on', turning the
        target off (and keeping it off) until they're all 'off' again -
        e.g. a humidity sensor's "too high" binary_sensor, so a humidifier
        bound to a schedule won't run (or will actively shut off) while
        it's already too humid, regardless of the schedule's own state.
      default: []
      selector:
        entity:
          domain:
            - binary_sensor
            - input_boolean
          multiple: true
    recheck_interval_minutes:
      name: Recheck interval, in minutes (optional)
      description: >-
        Re-assert the correct state on this cadence, not just at schedule
        transitions and HA startup. Leave blank/0 to disable (default) -
        that's the right choice for anything a manual override should be
        allowed to stick to until the next transition. Set to e.g. 5 for
        something where drift must be corrected quickly, like a valve.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          mode: box

triggers:
  - trigger: state
    entity_id: !input schedule_entity
  - trigger: state
    entity_id: !input skip_on_entities
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: "*"
    id: heartbeat

actions:
  - variables:
      schedule_entity: !input schedule_entity
      skip_entities: !input skip_on_entities
      recheck_interval: !input recheck_interval_minutes
  - variables:
      should_be_on: "{{ is_state(schedule_entity, 'on') }}"
      blocked: "{{ skip_entities | select('is_state', 'on') | list | count > 0 }}"
      is_heartbeat: "{{ trigger.id == 'heartbeat' }}"
      recheck_due: >-
        {{ recheck_interval | int(0) > 0 and (now().minute % (recheck_interval | int(1))) == 0 }}
  - condition: "{{ not is_heartbeat or recheck_due }}"
  - if: "{{ should_be_on and not blocked }}"
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: !input target_entities
    else:
      - action: homeassistant.turn_off
        target:
          entity_id: !input target_entities
